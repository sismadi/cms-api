name = "cms-api"
main = "worker.js"
compatibility_date = "2026-09-15"

# ------------------------------------------------------------
# D1 — isi database_id sesuai hasil `wrangler d1 create <NAMA_DB>`.
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "<NAMA_DB>"
database_id = "<ID_DB>"

# ------------------------------------------------------------
# TIDAK ADA [assets] lagi di sini.
#
# Repo ini sekarang murni microservice BACKEND (JSON API only), dipisah
# dari frontend (repo `cms-app`, dideploy sendiri — mis. GitHub Pages).
# Backend & frontend jadi 2 origin/domain berbeda, komunikasi lewat CORS
# fetch dengan routing QUERY STRING (?table=, ?view=, dst — lihat
# worker.js), bukan lagi path segment. Deploy Worker ini sendiri:
#
#   wrangler deploy
#
# lalu catat URL yang dihasilkan (mis. https://cms-api.<akun>.workers.dev)
# dan isikan ke API_BASE di cms-app/db.js.
# ------------------------------------------------------------
